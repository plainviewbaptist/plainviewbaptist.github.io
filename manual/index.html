<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>PBC App instruction manual</title>
  <meta name="description" content="A guide to every screen in the Plainview Baptist Church app." />
  <meta property="og:title" content="PBC App instruction manual" />
  <meta property="og:description" content="A guide to every screen in the Plainview Baptist Church app." />
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://plainviewbaptist.github.io/manual/" />
  <meta property="og:image" content="https://plainviewbaptist.github.io/icons/icon-512.png" />
  <meta property="og:site_name" content="Plainview Baptist Church" />
  <meta name="twitter:card" content="summary" />
  <meta name="twitter:title" content="PBC App instruction manual" />
  <meta name="twitter:description" content="A guide to every screen in the Plainview Baptist Church app." />
  <meta name="twitter:image" content="https://plainviewbaptist.github.io/icons/icon-512.png" />
  <link rel="canonical" href="https://plainviewbaptist.github.io/manual/" />
  <link rel="icon" href="/icons/favicon-32.png?v=2" />
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png?v=2" />
  <style>
    @font-face{font-family:Fraunces;src:url(/fonts/fraunces-latin-700-normal.woff2)format("woff2");font-weight:700;font-style:normal;font-display:swap}
    *{box-sizing:border-box}
    html,body{margin:0;background:#f7f3ec;color:#241f1b}
    body{min-height:100dvh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:32px 24px calc(32px + env(safe-area-inset-bottom));font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;text-align:center}
    .logo{width:min(42vw,160px);height:auto}
    .kicker{margin:20px 0 0;font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:#9a7426}
    h1{margin:10px 0 0;max-width:14em;font-family:Fraunces,Georgia,serif;font-size:clamp(32px,8vw,48px);font-weight:700;line-height:1.15}
    .lead{margin:16px 0 0;max-width:22em;font-size:18px;line-height:1.45;color:#5a4128}
    .btn{display:inline-block;margin-top:28px;padding:16px 28px;background:#2A2724;color:#e2bd6a;text-decoration:none;font-weight:700;font-size:18px;border-radius:12px}
    .note{margin:16px 0 0;font-size:14px;color:#5a4128}
    footer{margin-top:40px;font-size:15px}
    footer a{color:#5a4128}
  </style>
</head>
<body>
  <img class="logo" src="/logo.png" alt="Plainview Baptist Church" />
  <p class="kicker">Plainview Baptist Church · Hornbeck, Louisiana</p>
  <h1>PBC App instruction manual</h1>
  <p class="lead">A guide to every screen in the church app.</p>
  <a class="btn" href="PBC-App-Manual.pdf">Open the manual</a>
  <p class="note">Opens as a PDF, about 11 MB.</p>
  <footer><a href="https://plainviewbaptist.github.io/">Open the church app</a></footer>
</body>
</html>
