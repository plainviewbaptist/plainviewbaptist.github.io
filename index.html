    <style>html.display-boot,html.display-boot body{--lightningcss-light: ;--lightningcss-dark:initial;color-scheme:dark;background:#000!important}</style>
    <script>
      // Paint projector loads black before the bundle or the page background.
      // Covers a direct /display path and the /?/display deep link from 404.html.
      (function (l) {
        var path = l.pathname;
        var restored = l.search.length > 1 && l.search.charAt(1) === "/" ? l.search.slice(1).split("&")[0].split("?")[0] : "";
        var display = path === "/display" || path.indexOf("/display/") === 0 || restored === "/display" || restored.indexOf("/display/") === 0;
        if (!display) return;
        document.documentElement.classList.add("display-boot");
        document.documentElement.style.background = "#000";
        document.documentElement.style.colorScheme = "dark";
      })(window.location);
    </script>
    <script>
      // Restore a GitHub Pages deep link before the app reads the address.
      // Pairs with deploy/root-404.html. See shared/spa-redirect.ts.
      (function (l) {
        if (l.search[1] === "/") {
          var decoded = l.search
            .slice(1)
            .split("&")
            .map(function (s) {
              return s.replace(/~and~/g, "&");
            })
            .join("?");
          window.history.replaceState(null, "", l.pathname.slice(0, -1) + decoded + l.hash);
        }
      })(window.location);
    </script>
